services:
  - type: web
    name: msr-tracker
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: uploads
      mountPath: /var/data/uploads
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: msr-db
          property: connectionString
      - key: ENABLE_DEMO_DATA
        value: 'true'
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

databases:
  - name: msr-db
    databaseName: msr
    user: msr
    plan: basic-256mb
    postgresVersion: '16'
